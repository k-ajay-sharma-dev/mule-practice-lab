# Local services for the Studio test pack. Start only what a test needs, for example:
#   docker compose up -d kafka
# All ports bind to 127.0.0.1. Every value here is a local placeholder, not a credential.
# Image tags were checked on Docker Hub on 2026-11-04. The stack has not been started.

services:
  # Tests 2 and 3. Single-node KRaft, adapted from the Apache Kafka plaintext compose example.
  # 3.9.2 is the newest broker version listed as compatible with Kafka connector 4.15.4.
  kafka:
    image: apache/kafka:3.9.2
    hostname: broker
    container_name: studio-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  # Test 1. Authentication is disabled, so any password works. Mail is held in memory.
  greenmail:
    image: greenmail/standalone:2.1.15
    container_name: studio-greenmail
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users=default-reader:placeholder@mail.test,explicit-reader:placeholder@mail.test"

  # Test 6. init.sql runs only on the first start of an empty data directory.
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: studiotests
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: placeholder
    volumes:
      - ./db-partial-read/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  # Test 5, LocalStack route. Pinned to an older tag on purpose: LocalStack releases from
  # March 2026 need an auth token. Whether this tag starts without one is unconfirmed.
  # See "Test 5" in README.md before relying on it.
  localstack:
    image: localstack/localstack:4.14.0
    container_name: studio-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
